# Erstellt automatisch ein GitHub-Release mit fertiger App, sobald ein
# Versions-Tag gepusht wird:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Das Release enthält TidyRAM-<version>.zip (Universal: Apple Silicon + Intel).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # nötig, um ein Release anzulegen

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Schutz vor Versehen: Tag (v1.2.0) muss zu VERSION in build.sh passen.
      - name: Version prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(sed -n 's/^VERSION="\(.*\)"/\1/p' build.sh)
          echo "Tag: $TAG, build.sh: $BUILD_VERSION"
          test "$TAG" = "$BUILD_VERSION"

      - name: Automatische Tests
        run: swift test

      - name: Universal-Build
        run: ./build.sh --universal

      - name: ZIP erstellen
        run: ditto -c -k --keepParent build/TidyRAM.app "TidyRAM-${GITHUB_REF_NAME#v}.zip"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Abschnitt dieser Version aus CHANGELOG.md als Release-Text verwenden.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Installation:** ZIP herunterladen, entpacken, `TidyRAM.app` in den Ordner „Programme“ ziehen. Oder per Homebrew:
          ```
          brew tap seyi23/tidyram
          brew trust seyi23/tidyram   # ab Homebrew 7
          brew install --cask tidyram
          ```
          Beim ersten Start meldet macOS, dass die App nicht überprüft werden kann (sie ist nicht von Apple notarisiert).
          Dann: *Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“*. Details in der README.
          EOF
          gh release create "$GITHUB_REF_NAME" "TidyRAM-$VERSION.zip" \
            --title "TidyRAM $VERSION" --notes-file notes.md

      # Homebrew-Tap (seyi23/homebrew-tidyram) automatisch auf die neue Version
      # setzen. Braucht das Secret HOMEBREW_TAP_TOKEN (Fine-grained Token mit
      # "Contents: Read and write" NUR für das Tap-Repository, siehe CONTRIBUTING.md).
      # Fehlt das Secret, wird der Schritt übersprungen – dann von Hand mit
      # scripts/update-homebrew.sh aktualisieren.
      - name: Homebrew-Tap aktualisieren
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN fehlt – Tap bitte mit ./scripts/update-homebrew.sh aktualisieren."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "TidyRAM-$VERSION.zip" | awk '{print $1}')
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/seyi23/homebrew-tidyram.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/tidyram.rb
          if git diff --quiet; then echo "Tap ist bereits aktuell."; exit 0; fi
          # Commit als GitHub-Actions-Bot (anonyme Adresse, keine privaten Daten).
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -am "tidyram $VERSION"
          git push --quiet
          echo "Homebrew-Tap auf $VERSION aktualisiert (sha256 $SHA)."
